# Beat-list registry — scored targets
# schema: id, class (fork|study|watch|infra), upstream, score (rubric /15),
#         status, estate-play, added
# Higher score = higher priority. infra-critical targets bypass the queue.

targets:
  - id: mcp-integrity-sentinel
    class: infra
    upstream: null
    score: 15
    infra_critical: true
    status: pitch
    estate-play: >
      CRITICAL INFRASTRUCTURE GAP, validated by four incidents in Q3-Q4 2026:
      Deadbugz (runtime-gated MCP metadata poisoning via GitHub PRs),
      Mini Shai-Hulud npm worm (631 packages, MCP server among them),
      LiteLLM PyPI startup-hook compromise, GHAPPIER valid-signature attack.
      Every advisory recommends the same missing controls: tool-definition
      hash pinning, MCP-server allowlisting, continuous tools/list monitoring.
      No cohesive OSS tool ships them. Estate arms: tamper-audit (hash chains
      for tool-definition snapshots), policy-kit (fail-closed allowlists),
      auditlog (queryable trail), mcp-doctor (existing health gate, WyattAu/mcp-doctor).
      Build: mcp-config scanner (PR/diff IoC scanning for server entries),
      tool-definition hash pinning + mid-session mutation alerts,
      policy-kit allowlist enforcement. Name candidate: mcp-sentinel
      (extends WyattAu/mcp-doctor).
    added: "2026-11-01"
    sources:
      - https://www.pillar.security/blog/deadbugz-currently-active-mcp-supply-chain-campaign
      - https://github.com/advisories/GHSA-p6wc-j7x7-ff3v
      - https://orca.security/resources/research/ghappier-loader-npm-supply-chain-attack/
      - https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/

